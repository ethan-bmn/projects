name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    env:
      TEST_DATABASE_URL: postgresql://abby_projects:test-only-password@127.0.0.1:5432/abby_projects

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: abby_projects
          POSTGRES_USER: abby_projects
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abby_projects -d abby_projects"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
