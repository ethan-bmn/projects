name: abby-projects-production

x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB:-abby_projects}
  POSTGRES_USER: ${POSTGRES_USER:-abby_projects}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}

services:
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      <<: *database-environment
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?Set NUXT_SESSION_PASSWORD in .env.production}
      NUXT_ABBY_API_KEY: ${NUXT_ABBY_API_KEY:-}
      NUXT_ABBY_API_BASE_URL: ${NUXT_ABBY_API_BASE_URL:-https://api.app-abby.com}
      NUXT_CHARTDB_EXPORT_URL: http://chartdb-export:8081
      NUXT_PUBLIC_CHARTDB_URL: ${NUXT_PUBLIC_CHARTDB_URL:?Set the public HTTPS ChartDB URL in .env.production}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      chartdb-export:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-init:
    build:
      context: .
      target: database
    restart: "no"
    init: true
    environment:
      <<: *database-environment
      NUXT_OWNER_EMAIL: ${NUXT_OWNER_EMAIL:?Set NUXT_OWNER_EMAIL in .env.production}
      NUXT_OWNER_PASSWORD_HASH: ${NUXT_OWNER_PASSWORD_HASH:-}
      NUXT_OWNER_PASSWORD: ${NUXT_OWNER_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment: *database-environment
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  chartdb:
    image: ghcr.io/chartdb/chartdb:1.20.1
    restart: unless-stopped
    environment:
      DISABLE_ANALYTICS: "true"
      HIDE_CHARTDB_CLOUD: "true"
    ports:
      - "127.0.0.1:${CHARTDB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  chartdb-export:
    build:
      context: .
      dockerfile: tools/chartdb-export/Dockerfile
    restart: unless-stopped
    init: true
    shm_size: "256mb"
    environment:
      CHARTDB_URL: http://chartdb
    depends_on:
      chartdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8081/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
