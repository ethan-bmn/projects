# Optional loopback ports for local access or a reverse proxy running on the host.
# docker compose -f docker-compose.yaml -f docker-compose.host.yaml --env-file .env.production up -d --build --wait
services:
  app:
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
  chartdb:
    ports:
      - "127.0.0.1:${CHARTDB_PORT:-8080}:80"
