name: abby-projects

services:
  chartdb:
    image: ghcr.io/chartdb/chartdb:1.20.1
    profiles: ["diagrams"]
    restart: unless-stopped
    environment:
      DISABLE_ANALYTICS: "true"
      HIDE_CHARTDB_CLOUD: "true"
    ports:
      - "127.0.0.1:${CHARTDB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abby_projects}
      POSTGRES_USER: ${POSTGRES_USER:-abby_projects}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
