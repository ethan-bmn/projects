name: abby-projects

x-database-environment: &database-environment
  POSTGRES_DB: ${POSTGRES_DB:-abby_projects}
  POSTGRES_USER: ${POSTGRES_USER:-abby_projects}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}

services:
  app:
    networks: [default]
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      <<: *database-environment
      NUXT_OWNER_EMAIL: ${NUXT_OWNER_EMAIL:?Set NUXT_OWNER_EMAIL in .env.production}
      NUXT_OWNER_PASSWORD_HASH: ${NUXT_OWNER_PASSWORD_HASH:-}
      NUXT_OWNER_PASSWORD: ${NUXT_OWNER_PASSWORD:-}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?Set NUXT_SESSION_PASSWORD in .env.production}
      NUXT_ABBY_API_BASE_URL: ${NUXT_ABBY_API_BASE_URL:-https://api.app-abby.com}
      NUXT_CHARTDB_EXPORT_URL: http://chartdb-export:8081
      NUXT_PUBLIC_CHARTDB_URL: ${NUXT_PUBLIC_CHARTDB_URL:?Set the public HTTPS ChartDB URL in .env.production}
      NUXT_DOCUMENSO_URL: http://documenso:3000
      NUXT_PUBLIC_DOCUMENSO_URL: ${DOCUMENSO_PUBLIC_URL:?Set the public HTTPS Documenso URL in .env.production}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      chartdb-export:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    networks:
      default:
        aliases:
          - postgres
    image: postgres:18-alpine
    restart: unless-stopped
    environment: *database-environment
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  documenso-postgres:
    networks:
      default:
        aliases:
          - documenso-postgres
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: documenso
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: ${DOCUMENSO_POSTGRES_PASSWORD:?Set DOCUMENSO_POSTGRES_PASSWORD}
    volumes:
      - documenso_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documenso -d documenso"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  documenso:
    networks:
      default:
        aliases:
          - documenso
    build:
      context: .
      dockerfile: docker/documenso/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PORT: "3000"
      POSTGRES_DB: documenso
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: ${DOCUMENSO_POSTGRES_PASSWORD:?Set DOCUMENSO_POSTGRES_PASSWORD}
      NEXTAUTH_SECRET: ${DOCUMENSO_AUTH_SECRET:?Set DOCUMENSO_AUTH_SECRET}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:?Set DOCUMENSO_ENCRYPTION_KEY}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:?Set DOCUMENSO_ENCRYPTION_SECONDARY_KEY}
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_PUBLIC_URL:?Set DOCUMENSO_PUBLIC_URL}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      NEXT_PUBLIC_UPLOAD_TRANSPORT: database
      NEXT_PUBLIC_DISABLE_SIGNUP: ${DOCUMENSO_DISABLE_SIGNUP:-true}
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: ${DOCUMENSO_SMTP_HOST:?Set DOCUMENSO_SMTP_HOST}
      NEXT_PRIVATE_SMTP_PORT: ${DOCUMENSO_SMTP_PORT:-587}
      NEXT_PRIVATE_SMTP_USERNAME: ${DOCUMENSO_SMTP_USERNAME:-}
      NEXT_PRIVATE_SMTP_PASSWORD: ${DOCUMENSO_SMTP_PASSWORD:-}
      NEXT_PRIVATE_SMTP_SECURE: ${DOCUMENSO_SMTP_SECURE:-false}
      NEXT_PRIVATE_SMTP_FROM_NAME: ${DOCUMENSO_SMTP_FROM_NAME:-Abby Projects}
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${DOCUMENSO_SMTP_FROM_ADDRESS:?Set DOCUMENSO_SMTP_FROM_ADDRESS}
      NEXT_PRIVATE_SIGNING_TRANSPORT: local
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS: ${DOCUMENSO_SIGNING_CERTIFICATE:?Set DOCUMENSO_SIGNING_CERTIFICATE to your base64 P12 certificate}
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_SIGNING_PASSPHRASE:?Set DOCUMENSO_SIGNING_PASSPHRASE}
    expose:
      - "3000"
    depends_on:
      documenso-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(async r => process.exit(r.ok && (await r.json()).status === 'ok' ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  chartdb:
    networks:
      default:
        aliases:
          - chartdb
    image: ghcr.io/chartdb/chartdb:1.20.1
    restart: unless-stopped
    environment:
      DISABLE_ANALYTICS: "true"
      HIDE_CHARTDB_CLOUD: "true"
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  chartdb-export:
    networks:
      default:
        aliases:
          - chartdb-export
    build:
      context: .
      dockerfile: tools/chartdb-export/Dockerfile
    restart: unless-stopped
    init: true
    shm_size: "256mb"
    environment:
      CHARTDB_URL: http://chartdb
    depends_on:
      chartdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8081/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
  documenso_postgres_data:
